{% extends "base.html" %}

{% block title %}Admin Sign In | Face & QR Attendance System{% endblock %}

{% block content %}
<div class="login-page-wrapper">
    <!-- Floating Sparkle Accents -->
    <span class="doodle-sparkle gold" style="top: 10%; left: 20%;">✦</span>
    <span class="doodle-sparkle cyan" style="top: 18%; right: 22%; animation-delay: 0.8s;">✨</span>
    <span class="doodle-sparkle blue" style="bottom: 15%; left: 18%; animation-delay: 1.4s;">✦</span>

    <div class="login-card-container">
        <div class="glass-card login-card animate-fade-in">
            <!-- Header with Biometric Shield Logo -->
            <div class="login-header">
                <div class="ref-shield-logo animate-pulse-glow" style="width: 60px; height: 60px; margin: 0 auto 1.25rem; box-shadow: 0 0 26px rgba(0, 194, 255, 0.65);">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="rgba(0, 194, 255, 0.2)" stroke="#00c2ff"/>
                        <rect x="9" y="8" width="6" height="6" rx="1" fill="#0052cc" stroke="none"/>
                    </svg>
                </div>
                <h2>Administrator Login</h2>
                <p>Sign in to manage student profiles, biometric terminal &amp; reports</p>
            </div>

            <!-- Login Form -->
            <form action="{{ url_for('login', next=next_page) }}" method="POST" id="login-form">
                <input type="hidden" name="next" value="{{ next_page or '' }}">

                <!-- Username Field -->
                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label for="username" class="form-label" style="font-weight: 700; font-size: 0.88rem; margin-bottom: 0.4rem;">
                        Admin Username
                    </label>
                    <div style="position: relative;">
                        <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); font-size: 1.1rem; color: #64748b; pointer-events: none;">👤</span>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            class="form-control" 
                            placeholder="Enter username (e.g. admin)" 
                            required 
                            autofocus
                            style="padding: 0.75rem 1rem 0.75rem 2.75rem; font-size: 0.95rem; border-radius: var(--radius-sm);"
                        >
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                        <label for="password" class="form-label" style="font-weight: 700; font-size: 0.88rem; margin-bottom: 0;">
                            Password
                        </label>
                        <button type="button" onclick="togglePasswordVisibility()" style="background: none; border: none; color: var(--primary); font-size: 0.78rem; font-weight: 700; cursor: pointer;">
                            <span id="pwd-toggle-text">Show Password</span>
                        </button>
                    </div>
                    <div style="position: relative;">
                        <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); font-size: 1.1rem; color: #64748b; pointer-events: none;">🔒</span>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control" 
                            placeholder="Enter your password" 
                            required
                            style="padding: 0.75rem 1rem 0.75rem 2.75rem; font-size: 0.95rem; border-radius: var(--radius-sm);"
                        >
                    </div>
                </div>

                <!-- Sign In Action Button -->
                <button type="submit" class="btn btn-primary" id="btn-submit-login" style="width: 100%; padding: 0.85rem; font-size: 1rem; font-weight: 800; justify-content: center; border-radius: var(--radius-sm); box-shadow: 0 4px 16px rgba(0, 82, 204, 0.35);">
                    Sign In to Dashboard &rarr;
                </button>
            </form>

            <!-- Quick Credential Helper Badge -->
            <!-- <div class="login-hint-box" style="margin-top: 1.5rem; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: var(--radius-sm); padding: 0.85rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; font-size: 0.82rem;">
                <div>
                    <span style="color: #1e40af; font-weight: 700;">Default Credentials:</span>
                    <span style="font-family: monospace; color: #0052cc; font-weight: 700; margin-left: 0.25rem;">admin / admin123</span>
                </div>
                <button type="button" onclick="fillAdminCredentials()" class="btn btn-outline btn-sm" style="font-size: 0.75rem; padding: 0.25rem 0.6rem; color: #0052cc; border-color: #93c5fd; background: #ffffff;">
                    Auto-Fill
                </button>
            </div> -->

            <!-- Back to Home -->
            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem;">
                <a href="{{ url_for('home') }}" style="color: var(--text-muted); text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 0.35rem; transition: var(--transition);" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-muted)'">
                    &larr; Back to Welcome Screen
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function togglePasswordVisibility() {
        const pwdInput = document.getElementById('password');
        const toggleText = document.getElementById('pwd-toggle-text');
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            toggleText.innerText = 'Hide Password';
        } else {
            pwdInput.type = 'password';
            toggleText.innerText = 'Show Password';
        }
    }

    function fillAdminCredentials() {
        document.getElementById('username').value = 'admin';
        document.getElementById('password').value = 'admin123';
        const btn = document.getElementById('btn-submit-login');
        btn.focus();
    }
</script>
{% endblock %}
